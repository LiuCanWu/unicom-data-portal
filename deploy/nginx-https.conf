# Install only after domain, DNS, certificate and external release approval are ready.
# Replace example.invalid and certificate paths with approved values.
server {
    listen 80;
    server_name example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.invalid;
    root /var/www/unicom-data-portal/current;
    index index.html;

    ssl_certificate /etc/ssl/unicom-data-portal/fullchain.pem;
    ssl_certificate_key /etc/ssl/unicom-data-portal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/unicom-data-portal.access.log;
    error_log /var/log/nginx/unicom-data-portal.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ^~ /images/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~* \.(?:svg|ico|png|jpe?g|gif|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
