# Replace example.invalid with the approved domain before installation.
# Site root contains only the frontend/dist build, never the repository.
server {
    listen 80;
    server_name example.invalid;
    root /var/www/unicom-data-portal/current;
    index index.html;

    access_log /var/log/nginx/unicom-data-portal.access.log;
    error_log /var/log/nginx/unicom-data-portal.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location ^~ /images/ {
        try_files $uri =404;
        expires 7d;
    }
    location ~* \.(?:svg|ico|png|jpe?g|gif|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
