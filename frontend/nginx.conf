
server {
    listen 80;
    server_name _;

    # Vue + Vite 生产构建文件目录
    root /usr/share/nginx/html;
    index index.html;

    # 支持 Vue Router History 模式
    # 访问产品详情页或刷新页面时，回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 生成的静态资源使用缓存
    # 构建后的 JS/CSS 文件名包含 hash
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML 不长期缓存，便于用户获取最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 启用文本资源压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}
